th="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="450" y="604.48" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#162C34" text-anchor="start">409 conflict</text><path d="M 80 617 L 1470 617" fill="none" stroke="#C9D1CB" stroke-width="1" stroke-dasharray="7 5" /><text x="102" y="647.48" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#147D75" text-anchor="start">[Else: valid Proposed]</text><path d="M 740 664 L 1300 664" fill="none" stroke="#147D75" stroke-width="2"  marker-end="url(#arr)"/><text x="756" y="652.48" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#162C34" text-anchor="start">Update suggestion; INSERT task; serialize; COMMIT</text><path d="M 740 719 L 240 719" fill="none" stroke="#147D75" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><text x="256" y="707.48" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#162C34" text-anchor="start">New task → refresh private queries</text></svg>