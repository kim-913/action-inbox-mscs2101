<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 246 1425 514" width="1425" height="514"><metadata>Code reviewed: 251dfec1e3121fe90af9568c022010b4568a6179; November 13, 2026. Structure unchanged from original 025c2f0 baseline.</metadata><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#147D75"/></marker></defs><rect x="55" y="246" width="1425" height="514" fill="#F6F3EC"/><rect x="110" y="252" width="260" height="45" rx="0" fill="#DBEBE5" stroke="#147D75"/><text x="240" y="283" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#162C34" text-anchor="middle">Inbox UI</text><path d="M 240 297 L 240 741" fill="none" stroke="#C9D1CB" stroke-width="1" stroke-dasharray="7 5" /><rect x="610" y="252" width="260" height="45" rx="0" fill="#DBEBE5" stroke="#147D75"/><text x="740" y="283" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#162C34" text-anchor="middle">Fastify API</text><path d="M 740 297 L 740 741" fill="none" stroke="#C9D1CB" stroke-width="1" stroke-dasharray="7 5" /><rect x="1170" y="252" width="260" height="45" rx="0" fill="#DBEBE5" stroke="#147D75"/><text x="1300" y="283" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#162C34" text-anchor="middle">PostgreSQL</text><path d="M 1300 297 L 1300 741" fill="none" stroke="#C9D1CB" stroke-width="1" stroke-dasharray="7 5" /><path d="M 240 337 L 740 337" fill="none" stroke="#147D75" stroke-width="2"  marker-end="url(#arr)"/><text x="256" y="325.48" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#162C34" text-anchor="start">POST approve { version, title?, dueAt? }</text><rect x="772" y="351" width="622" height="38" rx="0" fill="#FFFFFF" stroke="none"/><text x="786" y="375.48" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#162C34" text-anchor="start">Session + Origin / CSRF; parse ID and request body</text><path d="M 7