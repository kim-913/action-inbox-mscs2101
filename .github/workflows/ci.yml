name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      OPENAI_ENABLED: "false"
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/action_inbox_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: action_inbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d action_inbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the PR merge revision or main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run all tests with PostgreSQL integration
        run: npm test
      - name: Build isolated web production assets
        env:
          VITE_API_URL: http://127.0.0.1:3002
        run: npm run build --workspace @action-inbox/web -- --outDir ../../.local-preview/ci-dist
